<h2>飞船仪表盘布局方案</h2>
<p class="subtitle">右下角悬浮框，展开/收缩两种状态，不影响主画布渲染</p>

<div class="split">
  <div class="mockup">
    <div class="mockup-header">方案 A：横版仪表盘</div>
    <div class="mockup-body" style="background:#0a0a1a; padding:20px; position:relative; min-height:450px;">
      <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#334; font-size:14px;">主画布（第一人称视角）</div>
      <!-- 收缩状态 -->
      <div style="position:absolute; bottom:16px; right:16px; width:44px; height:44px; border-radius:50%; background:rgba(0,180,255,0.3); border:2px solid rgba(0,180,255,0.6); display:flex; align-items:center; justify-content:center; color:#0bf; font-size:18px;">✧</div>
      <!-- 展开状态 -->
      <div style="position:absolute; bottom:16px; right:16px; width:520px; background:rgba(5,10,30,0.9); border:1px solid rgba(0,180,255,0.3); border-radius:8px; padding:16px; color:#ccc;">
        <div style="display:flex; gap:16px;">
          <!-- 左侧仪表 -->
          <div style="flex:1;">
            <div style="color:#0bf; font-size:12px; margin-bottom:8px;">位置 · 速度</div>
            <div style="display:flex; gap:12px; margin-bottom:8px;">
              <div style="background:rgba(0,180,255,0.05); border:1px solid rgba(0,180,255,0.15); border-radius:4px; padding:6px 10px; flex:1;">
                <div style="font-size:10px; color:#667;">坐标 X</div>
                <div style="color:#0f0; font-family:monospace; font-size:13px;">0.723 AU</div>
              </div>
              <div style="background:rgba(0,180,255,0.05); border:1px solid rgba(0,180,255,0.15); border-radius:4px; padding:6px 10px; flex:1;">
                <div style="font-size:10px; color:#667;">坐标 Y</div>
                <div style="color:#0f0; font-family:monospace; font-size:13px;">0.011 AU</div>
              </div>
              <div style="background:rgba(0,180,255,0.05); border:1px solid rgba(0,180,255,0.15); border-radius:4px; padding:6px 10px; flex:1;">
                <div style="font-size:10px; color:#667;">速度</div>
                <div style="color:#ff0; font-family:monospace; font-size:13px;">35.0 km/s</div>
              </div>
            </div>
            <div style="color:#0bf; font-size:12px; margin-bottom:8px;">飞行控制</div>
            <div style="display:flex; gap:8px; align-items:center;">
              <div style="background:rgba(0,180,255,0.1); border-radius:4px; padding:6px 12px; font-size:13px;">← 左转</div>
              <div style="background:rgba(0,180,255,0.1); border-radius:4px; padding:6px 12px; font-size:13px;">→ 右转</div>
              <div style="background:rgba(0,180,255,0.1); border-radius:4px; padding:6px 12px; font-size:13px;">↑ 抬头</div>
              <div style="background:rgba(0,180,255,0.1); border-radius:4px; padding:6px 12px; font-size:13px;">↓ 俯冲</div>
              <div style="background:rgba(0,255,128,0.15); border-radius:4px; padding:6px 14px; font-size:13px; color:#0f0;">+ 加速</div>
              <div style="background:rgba(255,80,80,0.15); border-radius:4px; padding:6px 14px; font-size:13px; color:#f55;">− 减速</div>
            </div>
          </div>
          <!-- 右侧导航图 -->
          <div style="width:180px;">
            <div style="color:#0bf; font-size:12px; margin-bottom:6px;">导航预览</div>
            <div style="background:rgba(0,0,0,0.4); border:1px solid rgba(0,180,255,0.2); border-radius:4px; width:180px; height:180px; position:relative; overflow:hidden;">
              <!-- 太阳 -->
              <div style="position:absolute; top:50%; left:50%; width:12px; height:12px; border-radius:50%; background:radial-gradient(#ff0,#f80); margin:-6px;"></div>
              <!-- 轨道环 -->
              <div style="position:absolute; top:26%; left:38%; width:48px; height:48px; border-radius:50%; border:1px solid rgba(255,255,255,0.15);"></div>
              <div style="position:absolute; top:20%; left:32%; width:72px; height:72px; border-radius:50%; border:1px solid rgba(255,255,255,0.15);"></div>
              <div style="position:absolute; top:14%; left:26%; width:96px; height:96px; border-radius:50%; border:1px solid rgba(255,255,255,0.15);"></div>
              <!-- 飞船 -->
              <div style="position:absolute; top:42%; left:52%; width:8px; height:8px; background:#0bf; clip-path:polygon(50% 0, 100% 100%, 50% 70%, 0 100%);"></div>
              <!-- 方向线 -->
              <div style="position:absolute; top:38%; left:54%; width:3px; height:16px; background:rgba(0,255,128,0.4); clip-path:polygon(50% 0, 100% 100%, 50% 80%, 0 100%);"></div>
            </div>
            <div style="display:flex; gap:4px; margin-top:4px;">
              <div style="font-size:9px; color:#667; flex:1;">← 顶视图</div>
              <div style="font-size:9px; color:#0bf;">▲ 飞船</div>
            </div>
          </div>
        </div>
        <!-- 收缩按钮 -->
        <div style="position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:50%; background:rgba(0,180,255,0.2); display:flex; align-items:center; justify-content:center; color:#0bf; font-size:12px; cursor:pointer;">−</div>
      </div>
    </div>
  </div>
  
  <div class="mockup">
    <div class="mockup-header">方案 B：竖版仪表盘</div>
    <div class="mockup-body" style="background:#0a0a1a; padding:20px; position:relative; min-height:450px;">
      <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#334; font-size:14px;">主画布（第一人称视角）</div>
      <div style="position:absolute; bottom:16px; right:16px; width:44px; height:44px; border-radius:50%; background:rgba(0,180,255,0.3); border:2px solid rgba(0,180,255,0.6); display:flex; align-items:center; justify-content:center; color:#0bf; font-size:18px;">✧</div>
      <div style="position:absolute; bottom:16px; right:16px; width:240px; background:rgba(5,10,30,0.9); border:1px solid rgba(0,180,255,0.3); border-radius:8px; padding:14px; color:#ccc;">
        <div style="color:#0bf; font-size:12px; margin-bottom:6px;">飞船仪表</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:10px;">
          <div style="background:rgba(0,180,255,0.05); border:1px solid rgba(0,180,255,0.15); border-radius:4px; padding:4px 8px;">
            <div style="font-size:9px; color:#667;">X</div><div style="color:#0f0; font-family:monospace; font-size:12px;">0.723</div>
          </div>
          <div style="background:rgba(0,180,255,0.05); border:1px solid rgba(0,180,255,0.15); border-radius:4px; padding:4px 8px;">
            <div style="font-size:9px; color:#667;">Y</div><div style="color:#0f0; font-family:monospace; font-size:12px;">0.011</div>
          </div>
          <div style="background:rgba(0,180,255,0.05); border:1px solid rgba(0,180,255,0.15); border-radius:4px; padding:4px 8px;">
            <div style="font-size:9px; color:#667;">Z</div><div style="color:#0f0; font-family:monospace; font-size:12px;">0.004</div>
          </div>
          <div style="background:rgba(0,180,255,0.05); border:1px solid rgba(0,180,255,0.15); border-radius:4px; padding:4px 8px;">
            <div style="font-size:9px; color:#667;">速度</div><div style="color:#ff0; font-family:monospace; font-size:12px;">35.0</div>
          </div>
        </div>
        <div style="color:#0bf; font-size:12px; margin-bottom:6px;">控制</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-bottom:10px;">
          <div style="background:rgba(0,180,255,0.1); border-radius:4px; padding:4px 0; text-align:center; font-size:11px;">↑ 抬头</div>
          <div style="background:rgba(0,180,255,0.1); border-radius:4px; padding:4px 0; text-align:center; font-size:11px;">↓ 俯冲</div>
          <div style="background:rgba(0,180,255,0.1); border-radius:4px; padding:4px 0; text-align:center; font-size:11px;">← 左转</div>
          <div style="background:rgba(0,180,255,0.1); border-radius:4px; padding:4px 0; text-align:center; font-size:11px;">→ 右转</div>
          <div style="background:rgba(0,255,128,0.15); border-radius:4px; padding:4px 0; text-align:center; font-size:11px; color:#0f0;">+ 加速</div>
          <div style="background:rgba(255,80,80,0.15); border-radius:4px; padding:4px 0; text-align:center; font-size:11px; color:#f55;">− 减速</div>
        </div>
        <div style="color:#0bf; font-size:12px; margin-bottom:6px;">导航图</div>
        <div style="background:rgba(0,0,0,0.4); border:1px solid rgba(0,180,255,0.2); border-radius:4px; width:210px; height:140px; position:relative; overflow:hidden;">
          <div style="position:absolute; top:50%; left:45%; width:10px; height:10px; border-radius:50%; background:radial-gradient(#ff0,#f80); margin:-5px;"></div>
          <div style="position:absolute; top:32%; left:34%; width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,0.15);"></div>
          <div style="position:absolute; top:24%; left:26%; width:60px; height:60px; border-radius:50%; border:1px solid rgba(255,255,255,0.15);"></div>
          <div style="position:absolute; top:18%; left:20%; width:84px; height:84px; border-radius:50%; border:1px solid rgba(255,255,255,0.15);"></div>
          <div style="position:absolute; top:46%; left:36%; width:6px; height:6px; background:#0bf; clip-path:polygon(50% 0, 100% 100%, 50% 70%, 0 100%);"></div>
          <div style="position:absolute; top:41%; left:38%; width:2px; height:10px; background:rgba(0,255,128,0.3); clip-path:polygon(50% 0, 100% 100%, 50% 80%, 0 100%);"></div>
        </div>
        <div style="position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:50%; background:rgba(0,180,255,0.2); display:flex; align-items:center; justify-content:center; color:#0bf; font-size:12px;">−</div>
      </div>
    </div>
  </div>
</div>
